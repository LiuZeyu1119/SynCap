[package]
name = "syncap-studio"
version = "0.1.0"
description = "Cross-platform client for SynCap-compatible head-mounted capture devices"
authors = ["SynCap"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "syncap_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
btleplug = "0.11"
dirs = "6"
futures-util = "0.3"
rand = "0.9"
syncap-core = { path = "../../../sdk/core" }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "time"] }
uuid = "1"
url = "2"
